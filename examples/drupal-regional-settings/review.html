<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocDemo</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --text: #1b1e24; --muted: #616875; --line: #e2e5ea;
  --hot: #e0317a; --active-bg: #fcebf2; --btn: #fff; --btn-hover: #f0f2f5; --stage: #e8ebef;
  --danger: #c3291f; --danger-bg: #fdeceb; --focus: #2f6fed;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 6px 20px rgb(0 0 0 / .07);
  color-scheme: light dark;
}
/* ?theme=light or ?theme=dark overrides the viewer's system setting (to match the host doc site). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #111317; --panel: #181b20; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b3038;
    --active-bg: #37192a; --btn: #20242b; --btn-hover: #2a2f37; --stage: #0b0d10;
    --danger: #ff7a70; --danger-bg: #3a1d1c; --focus: #7aa7ff;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
  }
}
:root[data-theme=dark] {
  --bg: #111317; --panel: #181b20; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b3038;
  --active-bg: #37192a; --btn: #20242b; --btn-hover: #2a2f37; --stage: #0b0d10;
  --danger: #ff7a70; --danger-bg: #3a1d1c; --focus: #7aa7ff;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
  color-scheme: dark;
}
:root[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: inherit; text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
code { font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: rgb(127 127 127 / .16); padding: 1px 4px; border-radius: 4px; }

.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; min-height: 0; }
.panel header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: var(--danger); background: var(--danger-bg); }
.from { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.from a { color: var(--hot); font-weight: 600; }
.steps { list-style: none; margin: 0; padding: 12px 12px 24px; overflow: auto; flex: 1; min-height: 0; }
.steps li { position: relative; padding: 9px 12px 9px 44px; margin: 2px 0; border-radius: 8px; overflow-wrap: anywhere; }
.steps li::before {
  content: attr(data-n); position: absolute; left: 12px; top: 10px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--text);
}
.steps li.dim { color: var(--muted); font-size: 14px; }
.steps li.dim::before { background: transparent; border: 1px dashed var(--line); }
.steps li.past::before { content: "\2713"; }
.steps li.active { background: var(--active-bg); }
.steps li.active::before { background: var(--hot); color: #fff; border: 0; }
.steps li.failed::before { background: var(--danger); color: #fff; content: "!"; }
.kind { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.now { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgb(127 127 127 / .2); font-size: 14px; font-weight: 600; }
.now small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

main { height: 100vh; min-width: 0; padding: 20px 24px 16px; display: grid; place-items: start center; container-type: size; }
/* The column holds frame + caption + controls; 150px is reserved for everything below the frame. */
.view { display: flex; flex-direction: column; gap: 12px; width: min(100cqw, (100cqh - 150px) * var(--ar, 1.6)); min-width: min(100%, 520px); }
.view.with-banner { width: min(100cqw, (100cqh - 300px) * var(--ar, 1.6)); }
.frame {
  position: relative; width: 100%; aspect-ratio: var(--ar, 1.6);
  background: var(--stage); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
}
.frame.advance { cursor: pointer; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 7px; }
.hot {
  position: absolute; margin: 0; padding: 0; background: transparent; cursor: pointer;
  border: 3px solid var(--hot); border-radius: 6px; animation: pulse 1.6s ease-out infinite;
  box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff;
}
.hot:focus-visible { outline-offset: 4px; }
/* Fill and select steps: the viewer types the value, or picks it, in a real control laid over the field in the screenshot. */
.field.hot { padding: 0 8px; font: inherit; color: #111; background: #fff; }
input.field { cursor: text; }
.field.hot:focus { outline: none; animation: none; box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff, 0 0 0 5px rgb(224 49 122 / .35); }
.field.hot::placeholder { color: inherit; opacity: .5; }
.field.hot.nudge { animation: shake .45s ease-in-out; }
@keyframes pulse {
  from { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff, 0 0 0 2px rgb(224 49 122 / .6); }
  to { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff, 0 0 0 16px rgb(224 49 122 / 0); }
}
.nudge { animation: shake .45s ease-in-out; }
@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.chip {
  position: absolute; margin: 6px 0; max-width: 60%; padding: 3px 10px; border-radius: 999px; pointer-events: none;
  background: var(--hot); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 2px 8px rgb(0 0 0 / .25);
}
.chip.typed::before { content: ""; display: inline-block; width: 1.25em; height: .8em; margin-right: 6px; vertical-align: -1px; border: 1.5px solid currentColor; border-radius: 2px;
  background: linear-gradient(currentColor 0 0) 50% 75% / 50% 1.5px no-repeat; }
.badge {
  position: absolute; left: 50%; bottom: 8%; translate: -50% 0; padding: 12px 20px; border-radius: 12px; cursor: pointer;
  font: inherit; font-size: 18px; font-weight: 600; color: #fff; background: rgb(18 20 25 / .9); border: 2px solid var(--hot);
  box-shadow: 0 6px 24px rgb(0 0 0 / .35); white-space: nowrap;
}
kbd { font: 600 .9em ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 8px; margin-left: 4px; border-radius: 6px; background: #fff; color: #111; box-shadow: inset 0 -2px 0 #bbb; }
@media (prefers-reduced-motion: reduce) {
  .hot { animation: none; box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff, 0 0 0 5px rgb(224 49 122 / .35); }
  .nudge { animation: none; background-color: rgb(224 49 122 / .45); }
  .field.hot.nudge { animation: none; background: #fbd3e3 !important; color: #111 !important; }
}

.caption, .banner { margin: 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.caption { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.caption strong { color: var(--text); }
.banner { background: var(--danger-bg); border: 1px solid var(--danger); }
.banner strong { display: block; color: var(--danger); }
.banner .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; }
.end { aspect-ratio: var(--ar, 1.6); display: grid; place-items: center; }
.card {
  width: min(100%, 520px); padding: 24px; text-align: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: auto; max-height: 100%;
}
.card img { width: 100%; max-width: 320px; border-radius: 6px; border: 1px solid var(--line); }
.card h2 { font-size: 20px; margin: 12px 0 4px; }
.card p { margin: 6px 0; }
.muted { color: var(--muted); font-size: 13px; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.progress { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn.primary { background: var(--hot); border-color: var(--hot); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.fatal { max-width: 460px; text-align: center; color: var(--muted); }

@media (max-width: 820px) {
  body { display: block; height: auto; }
  .panel { height: auto; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .panel header { padding: 14px 16px 10px; }
  .steps { padding: 8px 8px 12px; }
  main { display: block; height: auto; padding: 12px 16px 16px; container-type: normal; }
  .view { width: 100%; min-width: 0; }
  .badge { font-size: 15px; padding: 8px 14px; }
}

/* ?embed: for an iframe on the doc page itself. The page already shows the doc's steps, so the step
   list is hidden and the current step goes in the controls. The screenshot gets whatever height the
   caption and controls leave, at its own aspect ratio, so the demo fits an iframe of any size. */
.stage { display: contents; }
.where { display: none; }
body.embed { display: block; background: var(--panel); }
body.embed .panel, body.embed .controls [data-restart], body.embed #endDoc { display: none; }
body.embed main { height: 100vh; padding: 8px 8px 6px; display: block; container-type: normal; }
body.embed .view, body.embed .view.with-banner { width: 100%; min-width: 0; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px; }
body.embed .stage { display: grid; place-items: center; min-height: 0; container-type: size; }
body.embed .frame, body.embed .end { width: min(100cqw, 100cqh * var(--ar, 1.6)); }
body.embed .caption { padding: 6px 10px; font-size: 13px; }
body.embed .controls { flex-wrap: nowrap; }
body.embed .where { display: block; flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.embed .progress { margin-left: 0; }
</style>

    <nav class="controls" aria-label="Demo controls">

      <span class="progress" id="progress" aria-live="polite"></span>
      <button class="btn" type="button" data-restart>Restart</button>
    </nav>
  </div>
</main>

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const EMBED = params.has('embed');
if (EMBED) document.body.classList.add('embed');
if (/^(light|dark)$/.test(params.get('theme'))) document.documentElement.dataset.theme = params.get('theme');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (v) => (v * 100).toFixed(3) + '%';

// Decode HTML entities (&lt; etc.) as text; a textarea never runs markup.
const decoder = document.createElement('textarea');
const decode = (s) => { decoder.innerHTML = s; return decoder.value; };

// Minimal markdown: `code`, **bold** / __bold__, *em*, [links](url) as their text, backslash escapes.
// Everything is HTML-escaped after decoding entities.
function md(src) {
  return String(src).split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return '<code>' + esc(part.slice(1, -1)) + '</code>';
    part = decode(part.replace(/<\/?(?:a|img|br|span|div|p|sup|sub|kbd|em|strong|b|i|u|code|small|mark|del|ins|figure|figcaption|picture|source|svg|path)\b[^>]*>/gi, ' ')).replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
    const held = [];
    const s = esc(part.replace(/\\([\\`*_{}[\]()#+\-.!<>~|])/g, (_, c) => (held.push(c), '')))
      .replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => '<strong>' + (a ?? b) + '</strong>')
      .replace(/(^|[\s(])[*_]([^*_\s][^*_]*?)[*_](?=[\s).,:;!?]|$)/g, '$1<em>$2</em>');
    return s.replace(//g, () => esc(held.shift()));
  }).join('');
}

// "setup: ..." and "doc says ..." notes get a plain-language label.
function noteParts(note) {
  if (/^setup:\s*/i.test(note)) return ['Depends on setup', note.replace(/^setup:\s*/i, '')];
  if (/doc says/i.test(note)) return ['Doc mismatch', note];
  return ['', note];
}

function httpUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; }
}

function fatal(msg) {
  $('title').textContent = 'DocDemo';
  $('view').innerHTML = '<p class="fatal">' + esc(msg) + '</p>';
}

(async () => {
  let demo = DEMO;
  if (!demo) {
    try {
      const res = await fetch('demo.json');
      if (!res.ok) throw new Error(res.status);
      demo = await res.json();
    } catch {
      return fatal('Could not load the demo data. Open this file via the generated index.html, or serve the folder over HTTP.');
    }
  }
  if (!demo || !Array.isArray(demo.steps) || !demo.steps.length) return fatal('This demo has no frames.');
  start(demo);
})();

function start(demo) {
  const frames = demo.steps;
  const docSteps = (demo.doc && demo.doc.steps) || [];
  const END = frames.length; // index of the virtual end card

  const LAST = failedAt >= 0 ? failedAt : END; // a partial demo ends at its failed frame
  const failedDoc = failedAt >= 0 ? frames[failedAt].docStep : null;
  const vp = (demo.app && demo.app.viewport) || { width: 1440, height: 900 };
  const frameEl = $('frame'), shot = $('shot'), hot = $('hot'), typein = $('typein'), pick = $('pick'), chip = $('chip'), badge = $('badge');
  const docUrl = httpUrl(demo.doc && demo.doc.url);
  let cur = -1;

  document.title = demo.title + ' · DocDemo';
  $('title').textContent = demo.title;
  $('endTitle').textContent = demo.title;
  $('partial').hidden = demo.status !== 'partial';
  $('view').style.setProperty('--ar', vp.width / vp.height);
  for (const a of [$('from').querySelector('a'), $('endDoc'), $('bannerDoc')]) {
    if (docUrl) a.href = docUrl; else a.hidden = true;
  }
  if (docUrl) {
    $('from').hidden = false;
    $('from').querySelector('span').textContent = '· ' + (demo.doc.title || new URL(docUrl).hostname);
  }

  // Frame indices per doc step, and the doc-step list.
  const byDoc = new Map();
  frames.forEach((f, i) => { if (f.docStep) { if (!byDoc.has(f.docStep)) byDoc.set(f.docStep, []); byDoc.get(f.docStep).push(i); } });
  const items = new Map();
  for (const d of docSteps) {
    const li = document.createElement('li');
    li.dataset.n = d.index;
    if (d.kind !== 'action') {
      li.className = 'dim';
      li.innerHTML = '<span class="kind">' + esc(d.kind) + '</span>';
    }
    const text = document.createElement('span');
    text.innerHTML = md(d.text);
    const now = document.createElement('div');
    now.className = 'now';
    now.hidden = true;
    li.append(text, now);
    $('steps').append(li);
    items.set(d.index, { li, now });

  // End-card counts: M only counts documented action steps that have a successful frame.
  const actionDocs = new Set(docSteps.filter((d) => d.kind === 'action').map((d) => d.index));

      const px = g.getImageData(x0, Math.round((h.y + h.height * 0.3) * c.height), w, 1).data;

        e.n++; counts.set(key, e);
      }
      const [r, gr, b] = [...counts.values()].sort((p, q) => q.n - p.n)[0].rgb;

    const f = frames[cur];
    const failed = !!f && f.status === 'failed';
    frameEl.hidden = !f;
    $('end').hidden = !!f;
    setHash(f ? String(cur + 1) : 'end');
    $('progress').textContent = f ? `${cur + 1} / ${failedAt >= 0 ? failedAt + 1 : frames.length}` : 'Finished';
    $('back').disabled = cur === 0;
    $('next').disabled = !f || failed;
    $('next').textContent = cur === frames.length - 1 ? 'Finish' : 'Next';
    $('banner').hidden = !failed;
    $('view').classList.toggle('with-banner', failed);
    $('bannerNote').textContent = failed ? f.note || '' : '';
    // Notes are for the writer: only review.html has them, and an embed never shows them.
    let label = '', cap = '';
    if (f && !failed) {
      if (f.note && !EMBED) [label, cap] = noteParts(f.note);
      else if (!f.docStep) cap = 'Done. This is the result of the documented procedure.';
    }
    $('caption').replaceChildren(...(label ? [Object.assign(document.createElement('strong'), { textContent: label + ': ' })] : []), cap);
    $('caption').hidden = !cap;
    $('where').textContent = $('where').title = f ? (f.docStep ? `Step ${f.docStep}: ${f.instruction}` : f.instruction) : '';
    updatePanel(f, failed);
    if (!f) return;

    shot.src = f.image;
    shot.alt = f.instruction;
    const kind = f.status === 'ok' && f.action ? f.action.kind : null;
    const h = kind && kind !== 'press' ? f.hotspot : null;
    const typing = !!h && kind === 'fill' && f.action.value != null;
    // Demos recorded before dropdown choices were kept have no options: those stay click-to-advance.
    const picking = !!h && kind === 'select' && Array.isArray(f.action.options) && f.action.picked != null;
    field = typing ? typein : picking ? pick : null;

    pick.hidden = !picking;

    badge.hidden = kind !== 'press';
    if (h) {

      li.classList.toggle('failed', idx === failedDoc);

      now.textContent = f.instruction;
      const acts = fi.filter((j) => frames[j].action);

  pick.addEventListener('change', () => {
    const o = pick.selectedOptions[0], a = frames[cur].action;
    if (o && same(o.label, a.picked) && (a.pickedGroup == null || (o.parentElement.label && same(o.parentElement.label, a.pickedGroup)))) return go(1, true);
    pick.setAttribute('aria-invalid', 'true');
    nudge(pick);
  });
  frameEl.addEventListener('click', () => {
    if (field) {
      field.focus({ preventScroll: true });
      nudge(field);
      if (field === pick) try { pick.showPicker(); } catch { /* not supported: focus is enough */ }
    } else if (!hot.hidden) nudge(hot);
    else if (!badge.hidden) nudge(badge);
    else go(1);
  });
  $('next').addEventListener('click', () => go(1));
  $('back').addEventListener('click', () => go(-1));
  document.querySelectorAll('[data-restart]').forEach((b) => b.addEventListener('click', () => show(0)));
  addEventListener('hashchange', () => show(fromHash())); // show() also normalizes an out-of-range hash

  addEventListener('keydown', (e) => {
    const f = frames[cur];
    const onControl = e.target.closest && e.target.closest('button:not(#badge), a, input, select, textarea');
    if (e.repeat) return;
    if (f && f.status === 'ok' && f.action && f.action.kind === 'press' && !onControl) {
      const want = String(f.action.value || 'Enter').split('+').pop().toLowerCase();
      const got = e.key === ' ' ? 'space' : e.key.toLowerCase();
      if (got === want) { e.preventDefault(); return go(1, true); }
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key === ' ') {
      // Let Space activate a focused button or link natively instead of double-advancing.
      if (e.target.closest && e.target.closest('button, a, input, select, textarea')) return;
      e.preventDefault();
      go(1);
    }
  });

  show(fromHash());
}
</script>
</body>
</html>
